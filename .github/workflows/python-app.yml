name: ATTS-RAG CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies (exact versions from requirements.lock)
        run: |
          # age: the backup tests encrypt and restore a real backup
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner under time/memory limits; the lock's torch pin accepts the +cpu build.
          pip install torch -c requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt -c requirements.lock

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('app/rag/layer3/claim_verify.py', 'app/rag/reranker.py', 'app/rag/chunker.py', 'app/rag/threat_gate.py') }}
          restore-keys: hf-models-${{ runner.os }}-

      - name: Lint — syntax errors and undefined names only
        run: |
          flake8 app/ tests/ scripts/ \
            --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Tests (all layers — no LLM server required)
        env:
          PYTHONPATH: .
        run: |
          pytest tests -v --tb=short

      - name: Latency regression gate
        env:
          PYTHONPATH: .
        run: |
          python scripts/benchmark_layer3_latency.py --runs 3 --json-out benchmark_results.json
          python scripts/check_latency_regression.py \
            --file benchmark_results.json \
            --max-p50 5000 \
            --max-p95 10000

  docker-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the image (not pushed anywhere)
        run: |
          # A fake secret in the build folder: the image must not contain it (.dockerignore).
          echo "JWT_SECRET=ci-canary-must-not-be-in-the-image" > .env
          mkdir -p data && echo "canary" > data/users.db
          docker build -t atts-rag:ci .

      - name: Check the image
        run: |
          # Runs as the ordinary user 10001, not root.
          test "$(docker run --rm atts-rag:ci id -u)" = "10001"
          # No secrets, user data, git history or evaluation data inside.
          docker run --rm atts-rag:ci sh -c '
            test ! -e .env && test ! -e .git && test ! -e eval && test ! -e tests &&
            test -z "$(ls -A data)" && test -z "$(ls -A chroma_db)" &&
            ! grep -rqs ci-canary /app'
          # No compilers in the final image.
          docker run --rm atts-rag:ci sh -c '! command -v gcc'
          # The packages that need system libraries load, torch is the CPU build, and the account tool is there.
          docker run --rm atts-rag:ci python -c "
          import bcrypt, cv2, fitz, rapidocr_onnxruntime, torch, app.auth
          assert torch.__version__.endswith('+cpu'), torch.__version__
          print('imports ok, torch', torch.__version__)"
          docker run --rm atts-rag:ci python scripts/manage_users.py --help > /dev/null
          # The backup tools are in the image and can encrypt; the health probe used by the compose file imports
          docker run --rm atts-rag:ci sh -c 'age --version && python scripts/backup.py --help > /dev/null && python scripts/restore.py --help > /dev/null'
          docker run --rm atts-rag:ci python -c "import app.healthcheck_probe"
