name: ATTS-RAG CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Layer 1 (embeddings + classifier), Layer 3 (NLI verifier), the reranker and the chunker
          # import sentence-transformers / transformers at collection time, so CI needs them.
          # CPU-only torch keeps the runner under time/memory limits.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            sentence-transformers transformers langchain-huggingface \
            fastapi uvicorn[standard] pydantic loguru tenacity \
            python-multipart python-dotenv pyjwt[crypto] httpx \
            langchain langchain-community langchain-core langchain-text-splitters \
            langchain-ollama chromadb langchain-chroma \
            rank_bm25 pypdf pdfplumber python-docx pyyaml numpy \
            pytest pytest-asyncio

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('app/rag/layer3/claim_verify.py', 'app/rag/reranker.py', 'app/rag/chunker.py', 'app/rag/threat_gate.py') }}
          restore-keys: hf-models-${{ runner.os }}-

      - name: Lint — syntax errors and undefined names only
        run: |
          pip install flake8
          flake8 app/ tests/ scripts/ \
            --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Tests (all layers — no LLM server required)
        env:
          PYTHONPATH: .
        run: |
          pytest tests -v --tb=short

      - name: Latency regression gate
        env:
          PYTHONPATH: .
        run: |
          python scripts/benchmark_layer3_latency.py --runs 3 --json-out benchmark_results.json
          python scripts/check_latency_regression.py \
            --file benchmark_results.json \
            --max-p50 5000 \
            --max-p95 10000
