name: ATTS-RAG CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only lightweight deps needed for unit tests.
          # Heavy ML packages (torch, sentence-transformers) are excluded from CI
          # to keep the runner under time/memory limits.
          pip install \
            fastapi uvicorn[standard] pydantic loguru tenacity \
            python-multipart python-dotenv pyjwt[crypto] httpx \
            langchain langchain-community langchain-core langchain-text-splitters \
            langchain-ollama chromadb langchain-chroma \
            rank_bm25 pypdf pdfplumber python-docx \
            pytest pytest-asyncio

      - name: Lint — syntax errors and undefined names only
        run: |
          pip install flake8
          flake8 app/ tests/ scripts/ \
            --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Unit tests (Layer 1, 2, 3 gates — no LLM required)
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_threat_gate.py \
                 tests/test_layer2_trust_gate.py \
                 tests/test_layer3_gate.py \
                 tests/test_ingestion_guard.py \
                 tests/test_chunking.py \
                 -v --tb=short

      - name: Latency regression gate
        env:
          PYTHONPATH: .
        run: |
          python scripts/benchmark_layer3_latency.py --runs 3 --json-out benchmark_results.json
          python scripts/check_latency_regression.py \
            --file benchmark_results.json \
            --max-p50 5000 \
            --max-p95 10000
