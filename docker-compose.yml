version: '3.8'

services:
  # Local Ollama service for LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: atts_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # FastAPI Backend (RAG Engine & Security Gates)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atts_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  # Streamlit Dashboard Frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atts_streamlit
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:

